<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>視覺小說</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #030408; overflow: hidden; font-family: 'Noto Serif TC', serif; }

  @keyframes blink    { 0%,100%{opacity:1} 50%{opacity:0} }
  @keyframes float    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  @keyframes pfloat0  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
  @keyframes pfloat1  { 0%,100%{transform:translateY(0) translateX(0)} 50%{transform:translateY(-14px) translateX(10px)} }
  @keyframes pfloat2  { 0%,100%{transform:translateY(0)} 33%{transform:translateY(-8px)} 66%{transform:translateY(-22px)} }
  @keyframes fadeIn   { from{opacity:0} to{opacity:1} }

  input::placeholder { color: rgba(120,115,100,0.4); }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: rgba(180,155,90,0.2); }
  button { outline: none; font-family: inherit; }

  #root {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #030408; overflow: hidden;
  }

  #game-window {
    width: 100%; max-width: 760px;
    height: 100%; max-height: 580px;
    position: relative;
    background: #050810;
    background-size: cover; background-position: center;
    overflow: hidden;
    box-shadow: 0 0 80px rgba(0,0,0,0.8), inset 0 0 100px rgba(0,0,0,0.3);
    transition: background-image 0.6s ease;
  }

  #bg-overlay {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 0;
    transition: background 0.6s ease;
  }
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%);
    pointer-events: none; z-index: 1;
  }
  #particles-layer {
    position: absolute; inset: 0; z-index: 1;
  }
  #scanline {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  }
  #content {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    transition: opacity 0.3s ease;
  }

  /* Corner decorations */
  .corner {
    position: absolute; width: 12px; height: 12px;
    pointer-events: none; z-index: 3;
  }
  .corner.tl { top:8px; left:8px;  border-top: 1px solid rgba(180,155,90,0.2); border-left: 1px solid rgba(180,155,90,0.2); }
  .corner.tr { top:8px; right:8px; border-top: 1px solid rgba(180,155,90,0.2); border-right: 1px solid rgba(180,155,90,0.2); }
  .corner.bl { bottom:8px; left:8px;  border-bottom: 1px solid rgba(180,155,90,0.2); border-left: 1px solid rgba(180,155,90,0.2); }
  .corner.br { bottom:8px; right:8px; border-bottom: 1px solid rgba(180,155,90,0.2); border-right: 1px solid rgba(180,155,90,0.2); }

  /* Scene label */
  #scene-label {
    position: absolute; top: 20px; left: 24px; right: 24px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  #scene-name {
    font-size: 10px; letter-spacing: 4px; color: rgba(180,160,110,0.6);
    text-transform: uppercase; font-family: 'Cinzel', serif;
  }
  #chapter-name {
    font-size: 10px; letter-spacing: 3px; color: rgba(140,150,180,0.5);
    font-family: 'Noto Serif TC', serif;
  }

  /* Bottom UI */
  #bottom-ui { padding: 0 24px 24px; }
  #spacer { flex: 1; }

  /* Dialogue box */
  #dialogue-wrap { cursor: pointer; width: 100%; }
  #speaker-plate {
    margin-bottom: 8px; display: inline-block;
    padding: 4px 16px;
    background: rgba(180,155,90,0.12);
    border: 1px solid rgba(180,155,90,0.25);
    border-bottom: none;
  }
  #speaker-name {
    font-family: 'Cinzel', serif; font-size: 12px;
    letter-spacing: 3px; color: rgba(210,185,120,0.9);
  }
  #text-box {
    padding: 20px 24px;
    backdrop-filter: blur(8px);
    min-height: 80px; position: relative;
  }
  #dialogue-text {
    font-family: 'Noto Serif TC', serif;
    font-size: 15px; line-height: 2; margin: 0;
  }
  #cursor-blink {
    opacity: 0.6; animation: blink 0.7s infinite;
  }
  #subtext {
    font-family: 'Noto Serif TC', serif;
    font-size: 12px; color: rgba(150,145,135,0.7);
    font-style: italic; margin: 10px 0 0; line-height: 1.8;
  }
  #continue-indicator {
    position: absolute; bottom: 12px; right: 16px;
    font-size: 10px;
    animation: float 1.5s ease-in-out infinite;
    font-family: 'Noto Serif TC', serif; letter-spacing: 2px;
  }
  #line-dots {
    display: flex; gap: 4px; margin-top: 8px; justify-content: center;
  }
  .dot {
    height: 2px; border-radius: 1px;
    transition: all 0.3s;
  }

  /* Choice box */
  #choice-wrap { width: 100%; }
  #choice-prompt-box {
    background: rgba(5,5,10,0.55);
    border: 1px solid rgba(140,150,180,0.12);
    padding: 16px 24px; margin-bottom: 12px;
    backdrop-filter: blur(8px);
  }
  #choice-prompt-text {
    font-size: 14px; color: rgba(190,185,175,0.8);
    line-height: 1.8; letter-spacing: 0.5px;
  }
  #choices-list { display: flex; flex-direction: column; gap: 8px; }
  .choice-btn {
    background: rgba(8,6,14,0.7);
    border: 1px solid rgba(140,150,180,0.15);
    border-left: 3px solid rgba(100,100,130,0.2);
    padding: 14px 20px; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    transition: all 0.2s; backdrop-filter: blur(6px);
    width: 100%;
  }
  .choice-btn:hover {
    background: rgba(180,155,90,0.1);
    border-color: rgba(180,155,90,0.35);
    border-left-color: rgba(180,155,90,0.6);
  }
  .choice-btn.selected {
    background: rgba(180,155,90,0.2);
    border-color: rgba(210,185,120,0.5);
    border-left-color: rgba(210,185,120,0.8);
  }
  .choice-letter {
    font-size: 10px; letter-spacing: 2px;
    color: rgba(140,130,110,0.5);
    font-family: 'Cinzel', serif; min-width: 20px;
    transition: color 0.2s;
  }
  .choice-btn:hover .choice-letter, .choice-btn.selected .choice-letter {
    color: rgba(210,185,120,0.8);
  }
  .choice-text {
    font-size: 14px; color: rgba(190,185,175,0.75);
    line-height: 1.7; transition: color 0.2s;
  }
  .choice-btn:hover .choice-text, .choice-btn.selected .choice-text {
    color: rgba(230,220,200,0.95);
  }
  .choice-tag {
    margin-left: auto; font-size: 10px; letter-spacing: 2px;
    color: rgba(140,130,110,0.4); font-family: 'Cinzel', serif;
    white-space: nowrap;
  }

  /* Name input */
  #name-wrap { width: 100%; }
  #name-prompt-box {
    background: rgba(5,5,10,0.55);
    border: 1px solid rgba(140,150,180,0.12);
    padding: 20px 24px; margin-bottom: 16px;
    backdrop-filter: blur(8px);
  }
  #name-prompt-text {
    font-size: 15px; color: rgba(190,185,175,0.85); line-height: 2;
  }
  #name-input-row { display: flex; gap: 0; }
  #name-input {
    flex: 1;
    background: rgba(8,6,14,0.82);
    border: 1px solid rgba(140,150,180,0.15); border-right: none;
    color: rgba(230,220,200,0.95);
    padding: 14px 18px; font-size: 16px;
    font-family: 'Noto Serif TC', serif; outline: none;
    letter-spacing: 2px; transition: border-color 0.2s;
  }
  #name-input:focus { border-color: rgba(210,185,120,0.4); }
  #name-submit {
    background: rgba(30,25,20,0.5);
    border: 1px solid rgba(60,55,45,0.3);
    color: rgba(100,95,85,0.5);
    padding: 14px 24px; cursor: default;
    font-family: 'Cinzel', serif; font-size: 12px;
    letter-spacing: 3px; transition: all 0.2s;
  }
  #name-submit.active {
    background: rgba(180,155,90,0.2);
    border-color: rgba(210,185,120,0.4);
    color: rgba(210,185,120,0.9); cursor: pointer;
  }

  /* Gender select */
  #gender-wrap { width: 100%; }
  #gender-prompt-box {
    background: rgba(5,5,10,0.55);
    border: 1px solid rgba(140,150,180,0.12);
    padding: 20px 24px; margin-bottom: 16px;
    backdrop-filter: blur(8px);
  }
  #gender-prompt-text { font-size: 15px; color: rgba(190,185,175,0.85); }
  #gender-buttons { display: flex; gap: 12px; }
  .gender-btn {
    flex: 1;
    background: rgba(8,6,14,0.7);
    border: 1px solid rgba(140,150,180,0.15);
    color: rgba(190,185,175,0.75);
    padding: 20px; cursor: pointer;
    font-family: 'Noto Serif TC', serif;
    font-size: 18px; letter-spacing: 4px;
    transition: all 0.2s;
  }
  .gender-btn:hover {
    background: rgba(180,155,90,0.12);
    border-color: rgba(210,185,120,0.4);
    color: rgba(230,220,200,0.95);
  }

  /* Title screen */
  #title-screen {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px; text-align: center;
    opacity: 0; transition: opacity 2s ease;
  }
  #title-label {
    font-size: 10px; letter-spacing: 10px;
    color: rgba(140,150,180,0.4);
    font-family: 'Cinzel', serif;
    text-transform: uppercase; margin-bottom: 24px;
  }
  #title-main {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(40px, 8vw, 80px);
    font-weight: 300;
    color: rgba(230,220,200,0.0);
    letter-spacing: 16px; margin: 0 0 8px;
    -webkit-text-stroke: 1px rgba(210,195,155,0.5);
    text-shadow: 0 0 60px rgba(180,155,90,0.15);
  }
  #title-divider {
    width: 100px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(180,155,90,0.4), transparent);
    margin: 24px auto;
  }
  #title-tagline {
    font-family: 'Noto Serif TC', serif;
    font-size: 13px; color: rgba(160,155,140,0.55);
    line-height: 2.2; letter-spacing: 1px;
    max-width: 400px; margin-bottom: 48px; font-style: italic;
  }
  #start-btn {
    background: transparent;
    border: 1px solid rgba(180,155,90,0.3);
    color: rgba(210,185,120,0.8);
    padding: 14px 52px; font-size: 13px;
    letter-spacing: 6px; cursor: pointer;
    font-family: 'Cinzel', serif; text-transform: uppercase;
    transition: all 0.4s; margin-bottom: 16px;
  }
  #start-btn:hover {
    background: rgba(180,155,90,0.08);
    border-color: rgba(210,185,120,0.5);
    box-shadow: 0 0 30px rgba(180,155,90,0.1);
  }
  #title-chapter-label {
    font-size: 10px; color: rgba(100,100,110,0.35);
    letter-spacing: 3px; font-family: 'Cinzel', serif;
  }

  /* Chapter title screen */
  #chapter-title-screen {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; padding: 40px;
    opacity: 0; transition: opacity 1.5s ease;
  }
  #chapter-label {
    font-size: 11px; letter-spacing: 8px; color: rgba(180,155,90,0.5);
    font-family: 'Cinzel', serif; margin-bottom: 16px; text-transform: uppercase;
  }
  .chapter-divider {
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(180,155,90,0.4), transparent);
    margin-bottom: 20px;
  }
  #chapter-title-text {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(28px, 5vw, 48px); font-weight: 300;
    color: rgba(230,220,200,0.9); letter-spacing: 6px;
    text-shadow: 0 0 40px rgba(180,155,90,0.2);
  }
  #chapter-continue {
    font-size: 11px; color: rgba(140,135,125,0.4);
    letter-spacing: 4px; font-family: 'Cinzel', serif;
    margin-top: 32px;
  }

  /* Chapter end screen */
  #chapter-end-screen {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px; text-align: center;
    opacity: 0; transition: opacity 2s ease;
  }
  #end-label {
    font-size: 11px; letter-spacing: 6px; color: rgba(140,150,180,0.4);
    font-family: 'Cinzel', serif; margin-bottom: 16px;
  }
  #end-chapter-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px; font-weight: 300;
    color: rgba(190,185,175,0.6); letter-spacing: 8px; margin-bottom: 40px;
  }
  #end-divider {
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(140,150,180,0.2), transparent);
    margin-bottom: 40px;
  }
  #end-coming {
    font-size: 13px; color: rgba(130,125,115,0.5);
    line-height: 2; letter-spacing: 1px; max-width: 360px;
  }
  #end-fin {
    font-size: 11px; color: rgba(100,100,110,0.4);
    margin-top: 20px; letter-spacing: 2px;
  }

  /* Particles */
  .particle {
    position: absolute; border-radius: 50%;
  }
</style>
</head>
<body>
<div id="root">
  <div id="game-window">
    <div id="bg-overlay"></div>
    <div id="vignette"></div>
    <div id="particles-layer"></div>
    <div id="scanline"></div>
    <div id="content"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>
</div>

<script>
// ─── Story Data ───────────────────────────────────────────────────────────────
const STORY = {
  "ch0_open": {
    id:"ch0_open", bg:"night_fog", speaker:null,
    lines:["沒有人記得他的名字。","沒有人記得她的臉。","沒有人記得他們愛過誰，失去過什麼。","但有些事燃燒過。","就算燒完了，灰還在。"],
    next:"ch0_setup", isNarration:true,
  },
  "ch0_setup": {
    id:"ch0_setup", bg:"night_fog", speaker:null,
    lines:["維爾德城，學院入學前夕。","你站在城門口，背著一個裝了全部家當的布包。","學院的塔尖在霧裡若隱若現。","城裡的人說，能進學院的平民，幾百年才出一個。","上一個是諾南。","沒有人記得諾南長什麼樣子了。"],
    next:"ch0_name", isNarration:true,
  },
  "ch0_name": { id:"ch0_name", bg:"night_fog", type:"input_name", prompt:"你叫什麼名字？", next:"ch0_gender" },
  "ch0_gender": { id:"ch0_gender", bg:"night_fog", type:"input_gender", prompt:"你是？", next:"ch0_end" },
  "ch0_end": {
    id:"ch0_end", bg:"night_fog", speaker:null,
    lines:["記住這個名字。","因為最後，可能只有你自己還記得。"],
    next:"ch1_title", isNarration:true,
  },
  "ch1_title": { id:"ch1_title", type:"chapter_title", chapter:"第一章", title:"鑰匙", bg:"academy_gate", next:"ch1_fog" },
  "ch1_fog": {
    id:"ch1_fog", chapter:"第一章", scene:"維爾德・學院正門", bg:"academy_gate", speaker:null,
    lines:["維爾德的九月總是帶著霧。","不是那種早晨會散去的薄霧——是從古老森林裡漫出來的、帶著松脂和潮濕氣息的霧，附著在石板路上，附著在學院高聳的圍牆上，附著在每一個第一天踏進這裡的新生臉上。","像是某種無聲的提醒：你來到了一個和外面不一樣的地方。"],
    next:"ch1_entrance", isNarration:true,
  },
  "ch1_entrance": {
    id:"ch1_entrance", chapter:"第一章", scene:"維爾德・學院正門", bg:"academy_gate", speaker:null,
    lines:["你跟著入學的人群走進學院正門。","左邊是 ᛇ Eihwaz 一班的新生——他們的行李有人幫忙提，臉上帶著那種從小被告知「你理所當然屬於這裡」的平靜。","右邊是 ᛟ Othala 二班，幾個人已經在互相打招呼，像是早就認識。","你低下頭，把布包的帶子握緊一點。"],
    next:"ch1_reception", isNarration:true,
  },
  "ch1_reception": {
    id:"ch1_reception", chapter:"第一章", scene:"維爾德・學院報到處", bg:"academy_hall", speaker:"報到處職員",
    lines:["（翻了翻名冊，沒有抬頭）","「ᚾ Nauthiz 五班。西翼三樓……」","（停頓，皺了一下眉）","「……三一七號房。」"],
    next:"ch1_key_desc",
  },
  "ch1_key_desc": {
    id:"ch1_key_desc", chapter:"第一章", scene:"維爾德・學院報到處", bg:"academy_hall", speaker:null,
    lines:["你拿起鑰匙。","鑰匙的樣式有點奇怪——比一般的宿舍鑰匙重，鑰匙圈上刻著一個你看不懂的符文。","你想問，但報到處的人已經在招呼下一個人了。"],
    next:"ch1_corridor", isNarration:true,
  },
  "ch1_corridor": {
    id:"ch1_corridor", chapter:"第一章", scene:"學院・西翼三樓走廊", bg:"dormitory", speaker:null,
    lines:["西翼三樓的走廊很安靜。","三一七號房在走廊的最裡端，窗戶對著內院，常年照不到陽光的那種。","你把鑰匙插進鎖孔——","鎖開了。"],
    next:"ch1_door_open", isNarration:true,
  },
  "ch1_door_open": {
    id:"ch1_door_open", chapter:"第一章", scene:"學院・三一七號房", bg:"dorm_room", speaker:null,
    lines:["門推開，你看見房間裡已經有人。","靠窗的床上坐著一個人，背脊很直，手裡拿著一本書，但沒有在看。","他看著你走進來，沒有站起來，沉默了三秒。"],
    next:"ch1_brinke_first", isNarration:true,
  },
  "ch1_brinke_first": {
    id:"ch1_brinke_first", chapter:"第一章", scene:"學院・三一七號房", bg:"dorm_room", speaker:"布林克・弗洛斯特",
    lines:["「你走錯了。」"],
    subtext:"聲音很平，不是憤怒，不是疑問。是一個陳述，像在說天氣。",
    next:"ch1_choice1",
  },
  "ch1_choice1": {
    id:"ch1_choice1", chapter:"第一章", scene:"學院・三一七號房", bg:"dorm_room", type:"choice",
    prompt:"你怎麼回應？",
    choices:[
      {text:"「我沒有走錯。這是三一七號房。」", next:"ch1_reply_a", tag:"直接"},
      {text:"沉默，把鑰匙舉起來給他看。", next:"ch1_reply_b", tag:"沉默"},
      {text:"「……對不起，我確認一下。」", next:"ch1_reply_c", tag:"退讓"},
    ],
  },
  "ch1_reply_a": {
    id:"ch1_reply_a", chapter:"第一章", scene:"學院・三一七號房", bg:"dorm_room", speaker:null,
    lines:["他的視線從你臉上移到你手裡的鑰匙，停了一下。"],
    next:"ch1_reply_a2", isNarration:true,
  },
  "ch1_reply_a2": {
    id:"ch1_reply_a2", chapter:"第一章", scene:"學院・三一七號房", bg:"dorm_room", speaker:"布林克・弗洛斯特",
    lines:["「三一七號是我的房間。」"], next:"ch1_reply_a3",
  },
  "ch1_reply_a3": {
    id:"ch1_reply_a3", chapter:"第一章", scene:"學院・三一七號房", bg:"dorm_room", speaker:null,
    lines:["「我知道，」你說，「但這把鑰匙開的是這扇門。」","他站起來，走到你面前，把自己的鑰匙拿出來，和你手裡的並排放。","兩把鑰匙，同樣的房號，不同的樣式。","他看著它們，第一次出現了一個不是冷漠的表情：困惑。"],
    next:"ch1_admin", isNarration:true,
  },

// ─── Background Styles ────────────────────────────────────────────────────────
const RAW_BASE = "https://raw.githubusercontent.com/language2816/word_AI/f5156a0f41d859ca9ea7acd82a9be4559ce6b84a/%E5%A0%B4%E6%99%AF";
const BG_STYLES = {
  night_fog:    { image:`${RAW_BASE}/night_fog.png`,    overlay:"rgba(5,8,18,0.45)",   particles:true  },
  academy_gate: { image:`${RAW_BASE}/academy_gate.png`, overlay:"rgba(8,10,18,0.4)",   particles:true  },
  academy_hall: { image:`${RAW_BASE}/academy_hall.png`, overlay:"rgba(10,8,6,0.4)",    particles:false },
  dormitory:    { image:`${RAW_BASE}/dormitory.png`,    overlay:"rgba(8,10,16,0.42)",  particles:false },
  dorm_room:    { image:`${RAW_BASE}/dorm_room.png`,    overlay:"rgba(10,8,14,0.4)",   particles:false },
  dorm_night:   { image:`${RAW_BASE}/dorm_night.png`,   overlay:"rgba(4,5,14,0.55)",   particles:true  },
};

// ─── State ────────────────────────────────────────────────────────────────────
let state = {
  phase: "title",       // "title" | "game"
  nodeId: "ch0_open",
  lineIndex: 0,
  playerName: "",
  playerGender: "male",
};

// Typewriter state
let twTimer = null;
let twIndex = 0;
let twText = "";
let twDone = false;
let twCallback = null;

function twStart(text, speed, onDone) {
  clearInterval(twTimer);
  twText = text; twIndex = 0; twDone = false; twCallback = onDone;
  if (!text) { twDone = true; onDone?.(); return; }
  twTimer = setInterval(() => {
    twIndex++;
    renderTypewriter();
    if (twIndex >= twText.length) {
      clearInterval(twTimer);
      twDone = true;
      onDone?.();
      renderTypewriter();
    }
  }, speed || 38);
}
function twSkip() {
  clearInterval(twTimer);
  twIndex = twText.length;
  twDone = true;
  twCallback?.();
  renderTypewriter();
}

// ─── Particles ────────────────────────────────────────────────────────────────
function renderParticles(show) {
  const layer = document.getElementById("particles-layer");
  layer.innerHTML = "";
  if (!show) return;
  for (let i = 0; i < 20; i++) {
    const d = document.createElement("div");
    d.className = "particle";
    const big = i % 4 === 0;
    d.style.cssText = `
      width:${big ? 2 : 1}px; height:${big ? 2 : 1}px;
      background:${i % 5 === 0 ? "rgba(180,160,100,0.35)" : "rgba(140,160,200,0.2)"};
      left:${(i * 19 + 7) % 100}%;
      top:${(i * 31 + 13) % 100}%;
      animation:pfloat${i % 3} ${10 + (i % 6) * 2}s ease-in-out infinite;
      animation-delay:${(i * 0.6) % 7}s;
    `;
    layer.appendChild(d);
  }
}

// ─── Background ───────────────────────────────────────────────────────────────
let currentBg = null;
function updateBg(bgKey) {
  if (bgKey === currentBg) return;
  currentBg = bgKey;
  const bg = BG_STYLES[bgKey] || BG_STYLES.night_fog;
  const win = document.getElementById("game-window");
  win.style.backgroundImage = `url("${bg.image}")`;
  document.getElementById("bg-overlay").style.background = bg.overlay;
  renderParticles(bg.particles);
}

// ─── Navigate ─────────────────────────────────────────────────────────────────
function goTo(newId) {
  const content = document.getElementById("content");
  content.style.opacity = "0";
  setTimeout(() => {
    state.nodeId = newId;
    state.lineIndex = 0;
    content.style.opacity = "1";
    renderGame();
  }, 300);
}

// ─── Render Typewriter text ────────────────────────────────────────────────────
function renderTypewriter() {
  const node = STORY[state.nodeId];
  if (!node || node.type) return;
  const textEl = document.getElementById("dialogue-text");
  const cursorEl = document.getElementById("cursor-blink");
  const continueEl = document.getElementById("continue-indicator");
  const subtextEl = document.getElementById("subtext");
  const lines = node.lines || [];
  const isLast = state.lineIndex >= lines.length - 1;

  if (textEl) {
    textEl.textContent = twText.slice(0, twIndex);
    if (cursorEl) cursorEl.style.display = twDone ? "none" : "inline";
  }
  if (continueEl) {
    continueEl.style.display = twDone ? "block" : "none";
    continueEl.style.color = isLast ? "rgba(210,185,120,0.7)" : "rgba(150,145,135,0.5)";
    continueEl.textContent = isLast ? "繼續 ▶" : "▶";
  }
  if (subtextEl) {
    subtextEl.style.display = (twDone && node.subtext && state.lineIndex === lines.length - 1) ? "block" : "none";
  }
}

// ─── Resolve text ─────────────────────────────────────────────────────────────
function resolveText(text) {
  return (text || "")
    .replace(/\{name\}/g, state.playerName || "你")
    .replace(/他\/她/g, state.playerGender === "female" ? "她" : "他")
    .replace(/他的/g, state.playerGender === "female" ? "她的" : "他的");
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderGame() {
  if (state.phase === "title") { renderTitle(); return; }
  const node = STORY[state.nodeId];
  if (!node) return;
  updateBg(node.bg || "night_fog");

  if (node.type === "chapter_title") { renderChapterTitle(node); return; }
  if (node.type === "chapter_end")   { renderChapterEnd(node);   return; }

  // Normal scene
  const content = document.getElementById("content");
  content.innerHTML = `
    <div id="scene-label">
      <div id="scene-name">${node.scene || ""}</div>
      <div id="chapter-name">${node.chapter || ""}</div>
    </div>
    <div id="spacer"></div>
    <div id="bottom-ui"></div>
  `;

  const bottomUI = document.getElementById("bottom-ui");
  if (node.type === "input_name")   { renderNameInput(node, bottomUI); return; }
  if (node.type === "input_gender") { renderGenderSelect(node, bottomUI); return; }
  if (node.type === "choice")       { renderChoiceBox(node, bottomUI); return; }

  // Dialogue
  renderDialogue(node, bottomUI);
}

// ─── Title Screen ─────────────────────────────────────────────────────────────
function renderTitle() {
  updateBg("night_fog");
  const content = document.getElementById("content");
  content.innerHTML = `
    <div id="title-screen">
      <div id="title-label">A Text Adventure</div>
      <h1 id="title-main">〔　　〕</h1>
      <div id="title-divider"></div>
      <p id="title-tagline">沒有人記得他的名字。沒有人記得她的臉。<br />但有些事燃燒過。就算燒完了，灰還在。</p>
      <button id="start-btn">開始遊戲</button>
      <div id="title-chapter-label">第零章 · 第一章</div>
    </div>
  `;
  setTimeout(() => {
    const ts = document.getElementById("title-screen");
    if (ts) ts.style.opacity = "1";
  }, 200);
  document.getElementById("start-btn").addEventListener("click", () => {
    state.phase = "game";
    state.nodeId = "ch0_open";
    state.lineIndex = 0;
    renderGame();
  });
}

// ─── Chapter Title ────────────────────────────────────────────────────────────
function renderChapterTitle(node) {
  const content = document.getElementById("content");
  content.innerHTML = `
    <div id="chapter-title-screen">
      <div id="chapter-label">${node.chapter}</div>
      <div class="chapter-divider"></div>
      <h2 id="chapter-title-text">${node.title}</h2>
      <div class="chapter-divider" style="margin-top:20px;margin-bottom:0"></div>
      <div id="chapter-continue">CLICK TO CONTINUE</div>
    </div>
  `;
  setTimeout(() => {
    const ct = document.getElementById("chapter-title-screen");
    if (ct) ct.style.opacity = "1";
  }, 100);
  document.getElementById("chapter-title-screen").addEventListener("click", () => goTo(node.next));
}

// ─── Chapter End ──────────────────────────────────────────────────────────────
function renderChapterEnd(node) {
  const content = document.getElementById("content");
  content.innerHTML = `
    <div id="chapter-end-screen">
      <div id="end-label">END OF</div>
      <div id="end-chapter-title">${node.chapter}　${node.title}</div>
      <div id="end-divider"></div>
      <p id="end-coming">第二章即將到來。</p>
      <p id="end-fin">——完——</p>
    </div>
  `;
  setTimeout(() => {
    const ce = document.getElementById("chapter-end-screen");
    if (ce) ce.style.opacity = "1";
  }, 100);
}

// ─── Dialogue ─────────────────────────────────────────────────────────────────
function renderDialogue(node, container) {
  const lines = node.lines || [];
  const isNarration = node.isNarration;
  const speaker = node.speaker;
  const resolvedLine = resolveText(lines[state.lineIndex] || "");

  const boxBg     = isNarration ? "rgba(5,5,10,0.55)"   : "rgba(8,6,14,0.82)";
  const boxBorder = isNarration ? "rgba(140,150,180,0.12)" : "rgba(180,155,90,0.2)";
  const textColor = isNarration ? "rgba(190,185,175,0.85)" : "rgba(230,220,200,0.95)";

  container.innerHTML = `
    <div id="dialogue-wrap">
      ${speaker && !isNarration ? `
        <div id="speaker-plate"><span id="speaker-name">${speaker}</span></div>
      ` : ""}
      <div id="text-box" style="background:${boxBg};border:1px solid ${boxBorder};">
        <p id="dialogue-text" style="color:${textColor};"></p>
        <span id="cursor-blink">▌</span>
        <p id="subtext" style="display:none">${node.subtext || ""}</p>
        <div id="continue-indicator" style="display:none"></div>
      </div>
      ${lines.length > 1 ? `<div id="line-dots">${lines.map((_,i) => `
        <div class="dot" style="width:${i===state.lineIndex?16:4}px;background:${i===state.lineIndex?"rgba(210,185,120,0.7)":i<state.lineIndex?"rgba(180,155,90,0.4)":"rgba(100,100,120,0.3)"}"></div>
      `).join("")}</div>` : ""}
    </div>
  `;

  // Start typewriter
  twStart(resolvedLine, 38, () => { renderTypewriter(); });

  document.getElementById("dialogue-wrap").addEventListener("click", () => {
    if (!twDone) { twSkip(); return; }
    const isLast = state.lineIndex >= lines.length - 1;
    if (!isLast) {
      state.lineIndex++;
      renderDialogue(node, container);
    } else if (node.next) {
      goTo(node.next);
    }
  });
}

// ─── Choice Box ───────────────────────────────────────────────────────────────
function renderChoiceBox(node, container) {
  const prompt = resolveText(node.prompt);
  container.innerHTML = `
    <div id="choice-wrap">
      <div id="choice-prompt-box">
        <p id="choice-prompt-text">${prompt}</p>
      </div>
      <div id="choices-list">
        ${node.choices.map((c, i) => `
          <button class="choice-btn" data-idx="${i}">
            <span class="choice-letter">${String.fromCharCode(65+i)}</span>
            <span class="choice-text">${c.text}</span>
            ${c.tag ? `<span class="choice-tag">${c.tag}</span>` : ""}
          </button>
        `).join("")}
      </div>
    </div>
  `;
  document.querySelectorAll(".choice-btn").forEach((btn, i) => {
    btn.addEventListener("click", () => {
      btn.classList.add("selected");
      setTimeout(() => goTo(node.choices[i].next), 400);
    });
  });
}

// ─── Name Input ───────────────────────────────────────────────────────────────
function renderNameInput(node, container) {
  container.innerHTML = `
    <div id="name-wrap">
      <div id="name-prompt-box"><p id="name-prompt-text">${node.prompt}</p></div>
      <div id="name-input-row">
        <input id="name-input" placeholder="輸入你的名字…" maxlength="12" autocomplete="off" />
        <button id="name-submit">確認</button>
      </div>
    </div>
  `;
  const input = document.getElementById("name-input");
  const submit = document.getElementById("name-submit");
  const doSubmit = () => {
    const v = input.value.trim();
    if (!v) return;
    state.playerName = v;
    goTo(node.next);
  };
  input.addEventListener("input", () => {
    submit.classList.toggle("active", !!input.value.trim());
  });
  input.addEventListener("keydown", e => { if (e.key === "Enter") doSubmit(); });
  submit.addEventListener("click", doSubmit);
  input.focus();
}

// ─── Gender Select ────────────────────────────────────────────────────────────
function renderGenderSelect(node, container) {
  container.innerHTML = `
    <div id="gender-wrap">
      <div id="gender-prompt-box"><p id="gender-prompt-text">${node.prompt}</p></div>
      <div id="gender-buttons">
        <button class="gender-btn" data-value="male">男</button>
        <button class="gender-btn" data-value="female">女</button>
      </div>
    </div>
  `;
  document.querySelectorAll(".gender-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.playerGender = btn.dataset.value;
      goTo(node.next);
    });
  });
}

// ─── Init ─────────────────────────────────────────────────────────────────────
renderGame();
</script>
