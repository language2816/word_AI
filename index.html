<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>視覺小說</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #030408; overflow: hidden; font-family: 'Noto Serif TC', serif; }

  @keyframes blink    { 0%,100%{opacity:1} 50%{opacity:0} }
  @keyframes float    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  @keyframes pfloat0  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
  @keyframes pfloat1  { 0%,100%{transform:translateY(0) translateX(0)} 50%{transform:translateY(-14px) translateX(10px)} }
  @keyframes pfloat2  { 0%,100%{transform:translateY(0)} 33%{transform:translateY(-8px)} 66%{transform:translateY(-22px)} }
  @keyframes fadeIn   { from{opacity:0} to{opacity:1} }
  @keyframes slideUp  { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulseGold{ 0%,100%{box-shadow:0 0 0 rgba(180,155,90,0)} 50%{box-shadow:0 0 16px rgba(180,155,90,0.25)} }

  input::placeholder { color: rgba(120,115,100,0.4); }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: rgba(180,155,90,0.2); }
  button { outline: none; font-family: inherit; }

  #root {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #030408; overflow: hidden;
  }

  #game-window {
    width: 100%; max-width: 760px;
    height: 100%; max-height: 580px;
    position: relative;
    background: #050810;
    background-size: cover; background-position: center;
    overflow: hidden;
    box-shadow: 0 0 80px rgba(0,0,0,0.8), inset 0 0 100px rgba(0,0,0,0.3);
    transition: background-image 0.6s ease;
  }

  #bg-overlay { position:absolute;inset:0;pointer-events:none;z-index:0;transition:background 0.6s ease; }
  #vignette   { position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.7) 100%);pointer-events:none;z-index:1; }
  #particles-layer { position:absolute;inset:0;z-index:1; }
  #scanline   { position:absolute;inset:0;z-index:1;pointer-events:none;background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px); }
  #content    { position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;transition:opacity 0.3s ease; }

  .corner { position:absolute;width:12px;height:12px;pointer-events:none;z-index:3; }
  .corner.tl { top:8px;left:8px;border-top:1px solid rgba(180,155,90,0.2);border-left:1px solid rgba(180,155,90,0.2); }
  .corner.tr { top:8px;right:8px;border-top:1px solid rgba(180,155,90,0.2);border-right:1px solid rgba(180,155,90,0.2); }
  .corner.bl { bottom:8px;left:8px;border-bottom:1px solid rgba(180,155,90,0.2);border-left:1px solid rgba(180,155,90,0.2); }
  .corner.br { bottom:8px;right:8px;border-bottom:1px solid rgba(180,155,90,0.2);border-right:1px solid rgba(180,155,90,0.2); }

  /* ── 頂部工具列 ── */
  #top-toolbar {
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 10; display: flex; justify-content: flex-end;
    padding: 10px 16px; gap: 6px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.35), transparent);
    pointer-events: none;
  }
  .tool-btn {
    pointer-events: all;
    background: rgba(8,6,14,0.6);
    border: 1px solid rgba(180,155,90,0.18);
    color: rgba(180,160,110,0.65);
    padding: 5px 10px; font-size: 10px;
    letter-spacing: 2px; cursor: pointer;
    font-family: 'Cinzel', serif;
    transition: all 0.2s; backdrop-filter: blur(4px);
  }
  .tool-btn:hover {
    background: rgba(180,155,90,0.12);
    border-color: rgba(210,185,120,0.4);
    color: rgba(210,185,120,0.9);
  }
  /* 音量按鈕特殊狀態 */
  .tool-btn.muted { color: rgba(120,110,90,0.4); border-color: rgba(120,110,90,0.12); }

  /* 場景標題 */
  #scene-label { position:absolute;top:20px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none; }
  #scene-name  { font-size:10px;letter-spacing:4px;color:rgba(180,160,110,0.6);text-transform:uppercase;font-family:'Cinzel',serif; }
  #chapter-name{ font-size:10px;letter-spacing:3px;color:rgba(140,150,180,0.5);font-family:'Noto Serif TC',serif; }

  /* Bottom UI */
  #bottom-ui { padding: 0 24px 24px; }
  #spacer    { flex: 1; }

  /* Dialogue */
  #dialogue-wrap  { cursor:pointer;width:100%; }
  #speaker-plate  { margin-bottom:8px;display:inline-block;padding:4px 16px;background:rgba(180,155,90,0.12);border:1px solid rgba(180,155,90,0.25);border-bottom:none; }
  #speaker-name   { font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;color:rgba(210,185,120,0.9); }
  #text-box       { padding:20px 24px 20px 24px;backdrop-filter:blur(8px);min-height:80px;position:relative; }

  /* 主角頭像 */
  #player-avatar-wrap {
    position: absolute;
    bottom: 100%; left: 0;
    margin-bottom: 0;
    display: flex; align-items: flex-end; gap: 10px;
    pointer-events: none;
    animation: fadeIn 0.3s ease;
  }
  #player-avatar-frame {
    width: 56px; height: 56px;
    border: 1px solid rgba(180,155,90,0.35);
    background: rgba(8,6,14,0.85);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 0 18px rgba(180,155,90,0.12), inset 0 0 12px rgba(0,0,0,0.5);
  }
  #player-avatar-frame svg { width: 40px; height: 40px; }
  #player-avatar-name {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(210,185,120,0.85);
    margin-bottom: 6px;
    text-shadow: 0 0 12px rgba(180,155,90,0.3);
  }
  #dialogue-text  { font-family:'Noto Serif TC',serif;font-size:15px;line-height:2;margin:0; }
  #cursor-blink   { opacity:0.6;animation:blink 0.7s infinite; }
  #subtext        { font-family:'Noto Serif TC',serif;font-size:12px;color:rgba(150,145,135,0.7);font-style:italic;margin:10px 0 0;line-height:1.8; }
  #continue-indicator { position:absolute;bottom:12px;right:16px;font-size:10px;animation:float 1.5s ease-in-out infinite;font-family:'Noto Serif TC',serif;letter-spacing:2px; }
  #line-dots { display:flex;gap:4px;margin-top:8px;justify-content:center; }
  .dot { height:2px;border-radius:1px;transition:all 0.3s; }

  /* Choice */
  #choice-wrap      { width:100%; }
  #choice-prompt-box{ background:rgba(5,5,10,0.55);border:1px solid rgba(140,150,180,0.12);padding:16px 24px;margin-bottom:12px;backdrop-filter:blur(8px); }
  #choice-prompt-text{ font-size:14px;color:rgba(190,185,175,0.8);line-height:1.8;letter-spacing:0.5px; }
  #choices-list     { display:flex;flex-direction:column;gap:8px; }
  .choice-btn       { background:rgba(8,6,14,0.7);border:1px solid rgba(140,150,180,0.15);border-left:3px solid rgba(100,100,130,0.2);padding:14px 20px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all 0.2s;backdrop-filter:blur(6px);width:100%; }
  .choice-btn:hover { background:rgba(180,155,90,0.1);border-color:rgba(180,155,90,0.35);border-left-color:rgba(180,155,90,0.6); }
  .choice-btn.selected{ background:rgba(180,155,90,0.2);border-color:rgba(210,185,120,0.5);border-left-color:rgba(210,185,120,0.8); }
  .choice-letter    { font-size:10px;letter-spacing:2px;color:rgba(140,130,110,0.5);font-family:'Cinzel',serif;min-width:20px;transition:color 0.2s; }
  .choice-btn:hover .choice-letter,.choice-btn.selected .choice-letter{ color:rgba(210,185,120,0.8); }
  .choice-text      { font-size:14px;color:rgba(190,185,175,0.75);line-height:1.7;transition:color 0.2s; }
  .choice-btn:hover .choice-text,.choice-btn.selected .choice-text{ color:rgba(230,220,200,0.95); }
  .choice-tag       { margin-left:auto;font-size:10px;letter-spacing:2px;color:rgba(140,130,110,0.4);font-family:'Cinzel',serif;white-space:nowrap; }

  /* Name input */
  #name-wrap        { width:100%; }
  #name-prompt-box  { background:rgba(5,5,10,0.55);border:1px solid rgba(140,150,180,0.12);padding:20px 24px;margin-bottom:16px;backdrop-filter:blur(8px); }
  #name-prompt-text { font-size:15px;color:rgba(190,185,175,0.85);line-height:2; }
  #name-input-row   { display:flex;gap:0; }
  #name-input       { flex:1;background:rgba(8,6,14,0.82);border:1px solid rgba(140,150,180,0.15);border-right:none;color:rgba(230,220,200,0.95);padding:14px 18px;font-size:16px;font-family:'Noto Serif TC',serif;outline:none;letter-spacing:2px;transition:border-color 0.2s; }
  #name-input:focus { border-color:rgba(210,185,120,0.4); }
  #name-submit      { background:rgba(30,25,20,0.5);border:1px solid rgba(60,55,45,0.3);color:rgba(100,95,85,0.5);padding:14px 24px;cursor:default;font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;transition:all 0.2s; }
  #name-submit.active{ background:rgba(180,155,90,0.2);border-color:rgba(210,185,120,0.4);color:rgba(210,185,120,0.9);cursor:pointer; }

  /* Gender select */
  #gender-wrap      { width:100%; }
  #gender-prompt-box{ background:rgba(5,5,10,0.55);border:1px solid rgba(140,150,180,0.12);padding:20px 24px;margin-bottom:16px;backdrop-filter:blur(8px); }
  #gender-prompt-text{ font-size:15px;color:rgba(190,185,175,0.85); }
  #gender-buttons   { display:flex;gap:12px; }
  .gender-btn       { flex:1;background:rgba(8,6,14,0.7);border:1px solid rgba(140,150,180,0.15);color:rgba(190,185,175,0.75);padding:20px;cursor:pointer;font-family:'Noto Serif TC',serif;font-size:18px;letter-spacing:4px;transition:all 0.2s; }
  .gender-btn:hover { background:rgba(180,155,90,0.12);border-color:rgba(210,185,120,0.4);color:rgba(230,220,200,0.95); }

  /* Title screen */
  #title-screen     { width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;opacity:0;transition:opacity 2s ease; }
  #title-label      { font-size:10px;letter-spacing:10px;color:rgba(140,150,180,0.4);font-family:'Cinzel',serif;text-transform:uppercase;margin-bottom:24px; }
  #title-main       { font-family:'Noto Serif TC',serif;font-size:clamp(40px,8vw,80px);font-weight:300;color:rgba(230,220,200,0.0);letter-spacing:16px;margin:0 0 8px;-webkit-text-stroke:1px rgba(210,195,155,0.5);text-shadow:0 0 60px rgba(180,155,90,0.15); }
  #title-divider    { width:100px;height:1px;background:linear-gradient(90deg,transparent,rgba(180,155,90,0.4),transparent);margin:24px auto; }
  #title-tagline    { font-family:'Noto Serif TC',serif;font-size:13px;color:rgba(160,155,140,0.55);line-height:2.2;letter-spacing:1px;max-width:400px;margin-bottom:32px;font-style:italic; }
  #title-buttons    { display:flex;gap:12px;margin-bottom:16px; }
  #start-btn,#load-btn { background:transparent;border:1px solid rgba(180,155,90,0.3);color:rgba(210,185,120,0.8);padding:14px 36px;font-size:12px;letter-spacing:5px;cursor:pointer;font-family:'Cinzel',serif;text-transform:uppercase;transition:all 0.4s; }
  #start-btn:hover,#load-btn:hover { background:rgba(180,155,90,0.08);border-color:rgba(210,185,120,0.5);box-shadow:0 0 30px rgba(180,155,90,0.1); }
  #load-btn         { border-color:rgba(140,150,180,0.2);color:rgba(160,165,185,0.7); }
  #title-chapter-label{ font-size:10px;color:rgba(100,100,110,0.35);letter-spacing:3px;font-family:'Cinzel',serif; }

  /* Chapter screens */
  #chapter-title-screen{ width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:40px;opacity:0;transition:opacity 1.5s ease; }
  #chapter-label    { font-size:11px;letter-spacing:8px;color:rgba(180,155,90,0.5);font-family:'Cinzel',serif;margin-bottom:16px;text-transform:uppercase; }
  .chapter-divider  { width:60px;height:1px;background:linear-gradient(90deg,transparent,rgba(180,155,90,0.4),transparent);margin-bottom:20px; }
  #chapter-title-text{ font-family:'Noto Serif TC',serif;font-size:clamp(28px,5vw,48px);font-weight:300;color:rgba(230,220,200,0.9);letter-spacing:6px;text-shadow:0 0 40px rgba(180,155,90,0.2); }
  #chapter-continue { font-size:11px;color:rgba(140,135,125,0.4);letter-spacing:4px;font-family:'Cinzel',serif;margin-top:32px; }
  #chapter-end-screen{ width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;opacity:0;transition:opacity 2s ease; }
  #end-label        { font-size:11px;letter-spacing:6px;color:rgba(140,150,180,0.4);font-family:'Cinzel',serif;margin-bottom:16px; }
  #end-chapter-title{ font-family:'Noto Serif TC',serif;font-size:20px;font-weight:300;color:rgba(190,185,175,0.6);letter-spacing:8px;margin-bottom:40px; }
  #end-divider      { width:80px;height:1px;background:linear-gradient(90deg,transparent,rgba(140,150,180,0.2),transparent);margin-bottom:40px; }
  #end-coming       { font-size:13px;color:rgba(130,125,115,0.5);line-height:2;letter-spacing:1px;max-width:360px; }
  #end-fin          { font-size:11px;color:rgba(100,100,110,0.4);margin-top:20px;letter-spacing:2px; }

  /* Particles */
  .particle { position:absolute;border-radius:50%; }

  /* ── 存檔面板 ── */
  #save-panel {
    position:absolute;inset:0;z-index:20;
    background:rgba(2,3,8,0.92);
    backdrop-filter:blur(12px);
    display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;
    padding:32px 28px;
    animation:fadeIn 0.2s ease;
    overflow-y:auto;
  }
  #save-panel-title {
    font-family:'Cinzel',serif;font-size:12px;letter-spacing:6px;
    color:rgba(180,155,90,0.7);text-transform:uppercase;
    margin-bottom:24px;
  }
  .save-slots { width:100%;display:flex;flex-direction:column;gap:10px;margin-bottom:20px; }
  .save-slot {
    background:rgba(8,6,14,0.7);
    border:1px solid rgba(140,150,180,0.12);
    padding:14px 18px;display:flex;align-items:center;gap:14px;
    cursor:pointer;transition:all 0.2s;
  }
  .save-slot:hover { border-color:rgba(180,155,90,0.3);background:rgba(180,155,90,0.06); }
  .save-slot-num { font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;color:rgba(180,155,90,0.5);min-width:28px; }
  .save-slot-info { flex:1; }
  .save-slot-scene { font-size:12px;color:rgba(190,185,175,0.8);letter-spacing:1px; }
  .save-slot-time  { font-size:10px;color:rgba(130,125,115,0.45);margin-top:3px;letter-spacing:1px; }
  .save-slot-empty { font-size:11px;color:rgba(100,100,110,0.35);letter-spacing:2px;font-family:'Cinzel',serif; }
  .save-slot-action{ display:flex;gap:6px; }
  .slot-btn {
    font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;
    padding:5px 10px;border:1px solid;cursor:pointer;transition:all 0.2s;background:transparent;
  }
  .slot-btn.save-it { border-color:rgba(180,155,90,0.3);color:rgba(180,155,90,0.7); }
  .slot-btn.save-it:hover{ background:rgba(180,155,90,0.15);color:rgba(210,185,120,0.9); }
  .slot-btn.load-it { border-color:rgba(140,150,180,0.25);color:rgba(140,150,180,0.6); }
  .slot-btn.load-it:hover{ background:rgba(140,150,180,0.1);color:rgba(180,190,210,0.9); }
  .slot-btn.del-it  { border-color:rgba(160,80,80,0.2);color:rgba(160,80,80,0.4); }
  .slot-btn.del-it:hover{ background:rgba(160,80,80,0.1);color:rgba(200,100,100,0.8); }

  /* 手動存檔碼 */
  .save-code-section { width:100%;margin-top:8px; }
  .save-code-label   { font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;color:rgba(140,150,180,0.5);margin-bottom:8px; }
  #save-code-output  { width:100%;background:rgba(4,4,10,0.8);border:1px solid rgba(140,150,180,0.1);color:rgba(160,160,180,0.7);padding:10px 12px;font-size:10px;font-family:monospace;letter-spacing:1px;resize:none;height:48px;line-height:1.6;outline:none; }
  #load-code-input   { width:100%;background:rgba(4,4,10,0.8);border:1px solid rgba(140,150,180,0.1);color:rgba(160,160,180,0.7);padding:10px 12px;font-size:10px;font-family:monospace;letter-spacing:1px;resize:none;height:48px;line-height:1.6;outline:none;margin-top:6px; }
  .code-btns         { display:flex;gap:8px;margin-top:8px; }
  .code-btn {
    font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;
    padding:6px 14px;border:1px solid rgba(140,150,180,0.2);color:rgba(140,150,180,0.6);
    background:transparent;cursor:pointer;transition:all 0.2s;
  }
  .code-btn:hover{ border-color:rgba(180,190,210,0.4);color:rgba(180,190,210,0.9);background:rgba(140,150,180,0.08); }
  .panel-close-btn {
    margin-top:20px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:4px;
    color:rgba(130,125,115,0.5);background:transparent;border:none;cursor:pointer;transition:color 0.2s;
  }
  .panel-close-btn:hover{ color:rgba(180,155,90,0.8); }

  /* ── 劇情回顧面板 ── */
  #log-panel {
    position:absolute;inset:0;z-index:20;
    background:rgba(2,3,8,0.93);
    backdrop-filter:blur(12px);
    display:flex;flex-direction:column;
    padding:0;
    animation:fadeIn 0.2s ease;
  }
  #log-header {
    padding:20px 28px 16px;
    border-bottom:1px solid rgba(180,155,90,0.1);
    display:flex;justify-content:space-between;align-items:center;
    flex-shrink:0;
  }
  #log-title { font-family:'Cinzel',serif;font-size:11px;letter-spacing:6px;color:rgba(180,155,90,0.65);text-transform:uppercase; }
  #log-list {
    flex:1;overflow-y:auto;padding:20px 28px;
    display:flex;flex-direction:column;gap:12px;
  }
  .log-entry { animation:slideUp 0.3s ease both; }
  .log-entry-speaker {
    font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;
    color:rgba(210,185,120,0.6);margin-bottom:4px;
  }
  .log-entry-text {
    font-family:'Noto Serif TC',serif;font-size:13px;
    color:rgba(190,185,175,0.75);line-height:1.9;letter-spacing:0.5px;
    padding-left:12px;border-left:2px solid rgba(180,155,90,0.15);
  }
  .log-entry-text.narration {
    color:rgba(155,150,140,0.6);font-style:italic;border-left-color:rgba(140,150,180,0.15);
    padding-left:0;
  }
  .log-scene-divider {
    font-family:'Cinzel',serif;font-size:9px;letter-spacing:4px;
    color:rgba(120,120,140,0.3);text-align:center;
    padding:4px 0;text-transform:uppercase;
  }

  /* ── 音樂版權標籤 ── */
  #music-credit {
    position:absolute;bottom:6px;left:10px;z-index:5;
    font-size:9px;color:rgba(140,130,100,0.3);letter-spacing:1px;
    font-family:'Cinzel',serif;pointer-events:none;
    transition:opacity 0.5s;
  }

  /* ── 角色立繪容器 ── */
  #character-sprite-wrap {
    position: absolute;
    bottom: 80px;
    right: 16px;
    z-index: 3;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 0.5s ease;
  }

  /* 角色名稱標籤（隱藏）*/
  #character-name-label {
    display: none;
  }

  /* 角色圖片容器（無框、無背景） */
  #character-sprite-image-wrap {
    position: relative;
    width: 220px;
    height: 360px;
    overflow: visible;
    background: transparent;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  #character-sprite {
    height: 100%;
    width: auto;
    max-width: 220px;
    object-fit: contain;
    object-position: bottom center;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.85)) drop-shadow(0 0 8px rgba(0,0,0,0.5));
    animation: fadeIn 0.5s ease;
  }

  /* ── 通知提示 ── */
  #toast {
    position:absolute;top:50px;left:50%;transform:translateX(-50%);
    background:rgba(20,16,10,0.88);border:1px solid rgba(180,155,90,0.25);
    color:rgba(210,185,120,0.85);padding:8px 20px;
    font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;
    z-index:30;pointer-events:none;opacity:0;transition:opacity 0.3s;
    white-space:nowrap;
  }
</style>
</head>
<body>
<div id="root">
  <div id="game-window">
    <div id="bg-overlay"></div>
    <div id="vignette"></div>
    <div id="particles-layer"></div>
    <div id="scanline"></div>
    <div id="content"></div>

    <!-- 頂部工具列 -->
    <div id="top-toolbar">
      <button class="tool-btn" id="btn-log"   title="劇情回顧">LOG</button>
      <button class="tool-btn" id="btn-save"  title="存檔讀檔">SAVE</button>
      <button class="tool-btn muted" id="btn-music" title="音樂開關">♪</button>
    </div>

    <!-- 角色立繪 -->
    <div id="character-sprite-wrap" style="display:none">
      <div id="character-name-label"></div>
      <div id="character-sprite-image-wrap">
        <img id="character-sprite" src="" alt="" />
      </div>
    </div>

    <!-- 音樂版權 -->
    <div id="music-credit"></div>

    <!-- 通知 -->
    <div id="toast"></div>

    <!-- 存檔面板（隱藏） -->
    <div id="save-panel" style="display:none"></div>

    <!-- 劇情回顧面板（隱藏） -->
    <div id="log-panel" style="display:none"></div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════
// STORY DATA（分章節動態載入）
// 章節檔案：story_ch1.json / story_ch2.json / story_ch3.json
// ════════════════════════════════════════════════════
let STORY = {};

// 各章節的起始節點前綴 → 對應檔案
const CHAPTER_FILES = {
  ch0: "story_ch1.json",   // 序章包在第一章檔案裡
  ch1: "story_ch1.json",
  ch2: "story_ch2.json",
  ch3: "story_ch3.json",
};

// 已載入的章節（避免重複 fetch）
const loadedChapters = new Set();

// 取得節點 id 對應的章節前綴（e.g. "ch2_morning" → "ch2"）
function getChapterPrefix(nodeId) {
  const m = nodeId.match(/^(ch\d+)/);
  return m ? m[1] : null;
}

// 確保指定節點所在的章節已載入，載入後執行 callback
function ensureChapterLoaded(nodeId, callback) {
  const prefix = getChapterPrefix(nodeId);
  const file = CHAPTER_FILES[prefix];
  if (!file || loadedChapters.has(prefix)) {
    callback();
    return;
  }
  fetch(file)
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(data => {
      Object.assign(STORY, data);
      loadedChapters.add(prefix);
      callback();
    })
    .catch(err => {
      console.error("無法載入 " + file + "：", err);
      callback();  // 即使失敗也繼續，renderGame 會顯示錯誤
    });
}

// ════════════════════════════════════════════════════
// BACKGROUNDS
// ════════════════════════════════════════════════════
const RAW_BASE = "https://raw.githubusercontent.com/language2816/word_AI/f5156a0f41d859ca9ea7acd82a9be4559ce6b84a/%E5%A0%B4%E6%99%AF";
const BG_STYLES = {
  night_fog:    { image:`${RAW_BASE}/night_fog.png`,    overlay:"rgba(5,8,18,0.45)",   particles:true  },
  academy_gate: { image:`${RAW_BASE}/academy_gate.png`, overlay:"rgba(8,10,18,0.4)",   particles:true  },
  academy_hall: { image:`${RAW_BASE}/academy_hall.png`, overlay:"rgba(10,8,6,0.4)",    particles:false },
  dormitory:    { image:`${RAW_BASE}/dormitory.png`,    overlay:"rgba(8,10,16,0.42)",  particles:false },
  dorm_room:    { image:`${RAW_BASE}/dorm_room.png`,    overlay:"rgba(10,8,14,0.4)",   particles:false },
  dorm_night:   { image:`${RAW_BASE}/dorm_night.png`,   overlay:"rgba(4,5,14,0.55)",   particles:true  },
};

// ════════════════════════════════════════════════════
// CHARACTER SPRITES
// ════════════════════════════════════════════════════
const CHAR_BASE = "https://raw.githubusercontent.com/language2816/word_AI/refs/heads/main/%E8%A7%92%E8%89%B2%E4%BA%BA%E7%89%A9";

// speaker 名字 → 圖片檔名
// 布林克根據玩家性別自動切換
function getSpriteUrl(speaker) {
  if (!speaker) return null;
  const map = {
    "布林克・弗洛斯特": () =>
      state.playerGender === "female"
        ? `${CHAR_BASE}/%E5%B8%83%E6%9E%97%E5%85%8B%E3%83%BB%E5%BC%97%E6%B4%9B%E6%96%AF%E7%89%B9%EF%BC%88%E5%A5%B3%E7%89%88%EF%BC%89.png`
        : `${CHAR_BASE}/%E5%B8%83%E6%9E%97%E5%85%8B%E3%83%BB%E5%BC%97%E6%B4%9B%E6%96%AF%E7%89%B9%EF%BC%88%E7%94%B7%E7%89%88%EF%BC%89.png`,
    "艾芙琳・瑟頓教授": () => `${CHAR_BASE}/%E8%89%BE%E8%8A%99%E7%90%B3%E3%83%BB%E7%91%9F%E9%A0%93%E6%95%99%E6%8E%88.png`,
    "洛克斯・索羅里斯": () => `${CHAR_BASE}/%E6%B4%9B%E5%85%8B%E6%96%AF%E3%83%BB%E7%B4%A2%E7%BE%85%E9%87%8C%E6%96%AF.png`,
    "喬":               () => `${CHAR_BASE}/%E5%96%AC.png`,
  };
  return map[speaker] ? map[speaker]() : null;
}

let currentSprite = null;

function updateSprite(speaker) {
  const wrap = document.getElementById("character-sprite-wrap");
  const img  = document.getElementById("character-sprite");
  const nameLabel = document.getElementById("character-name-label");
  if (!wrap || !img || !nameLabel) return;

  const url = getSpriteUrl(speaker);

  if (!url) {
    // 沒有對應立繪 → 隱藏
    wrap.style.display = "none";
    currentSprite = null;
    return;
  }

  if (url === currentSprite) return; // 同一張不重複切換

  currentSprite = url;
  wrap.style.opacity = "0";
  wrap.style.display = "flex";
  
  // 設定角色名稱標籤
  nameLabel.textContent = speaker || "";
  
  img.src = url;
  img.onload = () => {
    wrap.style.opacity = "1";
  };
  img.onerror = () => {
    console.warn("立繪載入失敗：", url);
    wrap.style.display = "none";
  };
}


// ════════════════════════════════════════════════════
// 兩首曲目
const BGM_INSTRUMENTAL = { url: "https://github.com/language2816/word_AI/raw/refs/heads/main/Suno%20ai%E7%89%88%E6%AC%8A%E9%9F%B3%E6%A8%82/Suno%20ai%E9%8B%BC%E7%90%B4%E6%8F%90%E7%90%B4%E7%B4%94%E9%9F%B3%E6%A8%82%20.mp3", title: "鋼琴提琴純音樂" };
const BGM_VOCAL        = { url: "https://github.com/language2816/word_AI/raw/refs/heads/main/Suno%20ai%E7%89%88%E6%AC%8A%E9%9F%B3%E6%A8%82/ai%20suno%20%E4%BA%BA%E8%81%B2%E9%8B%BC%E7%90%B4+%E6%8F%90%E7%90%B4.mp3", title: "人聲鋼琴提琴" };

// 每個場景對應哪首曲目（"instrumental" 或 "vocal"）
const SCENE_MUSIC = {
  night_fog:    "vocal",         // 開場霧夜 → 人聲，帶入氣氛
  academy_gate: "instrumental",  // 劇情開始
  academy_hall: "instrumental",
  dormitory:    "instrumental",
  dorm_room:    "instrumental",
  dorm_night:   "instrumental",
  __title__:    "vocal",         // 標題畫面
  __chapter__:  "vocal",         // 章節過場
  __end__:      "vocal",         // 結局畫面
};

const SUNO_CREDIT = "♪ Music by Suno AI";

// ════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════
let state = {
  phase: "title",
  nodeId: "ch0_open",
  lineIndex: 0,
  playerName: "",
  playerGender: "male",
  affinity: 0,          // 布林克好感度（隱藏）
  visitedNodes: [],     // 已讀節點（用於劇情回顧）
  musicMuted: false,     // 音樂預設開啟
};

// 劇情回顧記錄
const logHistory = [];

// ════════════════════════════════════════════════════
// MUSIC ENGINE（雙軌 + 淡入淡出）
// ════════════════════════════════════════════════════
const audioPlayers = {
  instrumental: new Audio(),
  vocal:        new Audio(),
};
audioPlayers.instrumental.loop = true;
audioPlayers.vocal.loop        = true;
audioPlayers.instrumental.src  = BGM_INSTRUMENTAL.url;
audioPlayers.vocal.src         = BGM_VOCAL.url;
audioPlayers.instrumental.volume = 0;
audioPlayers.vocal.volume        = 0;

const TARGET_VOL = 0.85;
const FADE_MS    = 1200;
let activeTrack  = null;   // "instrumental" | "vocal" | null
let fadeInterval = null;

function fadeToTrack(trackName) {
  if (activeTrack === trackName) return;
  const prev = activeTrack ? audioPlayers[activeTrack] : null;
  const next  = audioPlayers[trackName];
  activeTrack = trackName;

  clearInterval(fadeInterval);

  if (!state.musicMuted) {
    next.play().catch(()=>{});
  }

  let elapsed = 0;
  const step = 50;
  const prevStart = prev ? prev.volume : 0;
  const nextStart = next.volume;

  fadeInterval = setInterval(() => {
    elapsed += step;
    const t = Math.min(elapsed / FADE_MS, 1);
    if (prev) prev.volume = Math.max(0, prevStart * (1 - t));
    next.volume = nextStart + (TARGET_VOL - nextStart) * t;
    if (t >= 1) {
      clearInterval(fadeInterval);
      if (prev) { prev.pause(); prev.volume = 0; }
    }
  }, step);

  // 版權標籤
  const credit = document.getElementById("music-credit");
  const info   = trackName === "instrumental" ? BGM_INSTRUMENTAL : BGM_VOCAL;
  if (credit) credit.textContent = `${SUNO_CREDIT} · ${info.title}`;
}

function playMusicForScene(sceneKey) {
  const track = SCENE_MUSIC[sceneKey] || "instrumental";
  fadeToTrack(track);
}

function toggleMusic() {
  state.musicMuted = !state.musicMuted;
  const btn = document.getElementById("btn-music");
  if (state.musicMuted) {
    Object.values(audioPlayers).forEach(a => a.pause());
    btn.classList.add("muted");
    showToast("音樂已靜音");
  } else {
    if (activeTrack) {
      audioPlayers[activeTrack].volume = TARGET_VOL;
      audioPlayers[activeTrack].play().catch(()=>{});
    }
    btn.classList.remove("muted");
    showToast("音樂已開啟");
  }
}

// ════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = "0"; }, 1800);
}

// ════════════════════════════════════════════════════
// SAVE / LOAD  (localStorage + 手動碼)
// ════════════════════════════════════════════════════
const LS_PREFIX = "vn_save_slot_";
const MAX_SLOTS = 3;

function buildSaveData() {
  return {
    ver: 1,
    ts: Date.now(),
    state: JSON.parse(JSON.stringify(state)),
    log: logHistory.slice(-60),   // 最近60筆
  };
}

function applySaveData(data) {
  if (!data || data.ver !== 1) return false;
  Object.assign(state, data.state);
  logHistory.length = 0;
  (data.log || []).forEach(e => logHistory.push(e));
  return true;
}

function saveToSlot(slot) {
  try {
    const data = buildSaveData();
    const node = STORY[state.nodeId];
    data.meta = {
      scene: node ? (node.scene || node.chapter || node.type || state.nodeId) : state.nodeId,
      timeStr: new Date(data.ts).toLocaleString("zh-TW", {month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}),
    };
    localStorage.setItem(LS_PREFIX + slot, JSON.stringify(data));
    showToast(`存檔 ${slot} 已儲存`);
  } catch(e) { showToast("存檔失敗"); }
}

function loadFromSlot(slot) {
  try {
    const raw = localStorage.getItem(LS_PREFIX + slot);
    if (!raw) { showToast("此槽沒有存檔"); return; }
    const data = JSON.parse(raw);
    if (!applySaveData(data)) { showToast("存檔格式錯誤"); return; }
    closeSavePanel();
    state.phase = "game";
    ensureChapterLoaded(state.nodeId, () => {
      renderGame();
      showToast(`存檔 ${slot} 已讀取`);
    });
  } catch(e) { showToast("讀取失敗"); }
}

function deleteSlot(slot) {
  localStorage.removeItem(LS_PREFIX + slot);
  renderSavePanel();
  showToast(`存檔 ${slot} 已刪除`);
}

function getSlotData(slot) {
  try {
    const raw = localStorage.getItem(LS_PREFIX + slot);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function encodeStateToCode() {
  const data = buildSaveData();
  return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}

function decodeCodeToState(code) {
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    return data;
  } catch(e) { return null; }
}

// ════════════════════════════════════════════════════
// SAVE PANEL UI
// ════════════════════════════════════════════════════
function openSavePanel() {
  const panel = document.getElementById("save-panel");
  panel.style.display = "flex";
  renderSavePanel();
}
function closeSavePanel() {
  document.getElementById("save-panel").style.display = "none";
  if (typeof window._savePanelOnClose === "function") {
    window._savePanelOnClose();
  }
}

function renderSavePanel() {
  const panel = document.getElementById("save-panel");
  const code = encodeStateToCode();
  let slotsHtml = "";
  for (let i = 1; i <= MAX_SLOTS; i++) {
    const d = getSlotData(i);
    if (d && d.meta) {
      slotsHtml += `
        <div class="save-slot">
          <div class="save-slot-num">0${i}</div>
          <div class="save-slot-info">
            <div class="save-slot-scene">${d.meta.scene}</div>
            <div class="save-slot-time">${d.meta.timeStr}</div>
          </div>
          <div class="save-slot-action">
            <button class="slot-btn save-it" onclick="saveToSlot(${i});renderSavePanel()">存入</button>
            <button class="slot-btn load-it" onclick="loadFromSlot(${i})">讀取</button>
            <button class="slot-btn del-it"  onclick="deleteSlot(${i})">刪除</button>
          </div>
        </div>`;
    } else {
      slotsHtml += `
        <div class="save-slot">
          <div class="save-slot-num">0${i}</div>
          <div class="save-slot-info"><div class="save-slot-empty">— 空槽 —</div></div>
          <div class="save-slot-action">
            <button class="slot-btn save-it" onclick="saveToSlot(${i});renderSavePanel()">存入</button>
          </div>
        </div>`;
    }
  }
  panel.innerHTML = `
    <div id="save-panel-title">存檔 · 讀檔</div>
    <div class="save-slots">${slotsHtml}</div>

    <div class="save-code-section">
      <div class="save-code-label">匯出存檔碼</div>
      <textarea id="save-code-output" readonly>${code}</textarea>
      <div class="code-btns">
        <button class="code-btn" onclick="copyCode()">複製</button>
      </div>
    </div>

    <div class="save-code-section" style="margin-top:16px">
      <div class="save-code-label">匯入存檔碼</div>
      <textarea id="load-code-input" placeholder="貼上存檔碼…"></textarea>
      <div class="code-btns">
        <button class="code-btn" onclick="importCode()">匯入並讀取</button>
      </div>
    </div>

    <button class="panel-close-btn" onclick="closeSavePanel()">✕ 關閉</button>
  `;
}

function copyCode() {
  const el = document.getElementById("save-code-output");
  if (!el) return;
  navigator.clipboard.writeText(el.value).then(() => showToast("存檔碼已複製")).catch(() => {
    el.select(); document.execCommand("copy"); showToast("存檔碼已複製");
  });
}

function importCode() {
  const el = document.getElementById("load-code-input");
  if (!el || !el.value.trim()) { showToast("請先貼上存檔碼"); return; }
  const data = decodeCodeToState(el.value);
  if (!data || !applySaveData(data)) { showToast("存檔碼無效"); return; }
  closeSavePanel();
  state.phase = "game";
  ensureChapterLoaded(state.nodeId, () => {
    renderGame();
    showToast("存檔碼讀取成功");
  });
}

// ════════════════════════════════════════════════════
// LOG PANEL UI
// ════════════════════════════════════════════════════
function openLogPanel() {
  const panel = document.getElementById("log-panel");
  panel.style.display = "flex";
  renderLogPanel();
}
function closeLogPanel() {
  document.getElementById("log-panel").style.display = "none";
}

function renderLogPanel() {
  const panel = document.getElementById("log-panel");
  if (!logHistory.length) {
    panel.innerHTML = `
      <div id="log-header">
        <div id="log-title">劇情回顧</div>
        <button class="panel-close-btn" style="margin:0" onclick="closeLogPanel()">✕</button>
      </div>
      <div id="log-list" style="align-items:center;justify-content:center">
        <div style="font-family:'Cinzel',serif;font-size:10px;letter-spacing:4px;color:rgba(120,115,105,0.35)">— 尚無記錄 —</div>
      </div>`;
    return;
  }
  let html = "";
  let lastScene = null;
  logHistory.forEach((entry, i) => {
    if (entry.scene && entry.scene !== lastScene) {
      html += `<div class="log-scene-divider" style="animation-delay:${i*0.02}s">${entry.scene}</div>`;
      lastScene = entry.scene;
    }
    if (entry.speaker) {
      html += `<div class="log-entry" style="animation-delay:${i*0.02}s">
        <div class="log-entry-speaker">${entry.speaker}</div>
        <div class="log-entry-text">${entry.text}</div>
      </div>`;
    } else {
      html += `<div class="log-entry" style="animation-delay:${i*0.02}s">
        <div class="log-entry-text narration">${entry.text}</div>
      </div>`;
    }
  });
  panel.innerHTML = `
    <div id="log-header">
      <div id="log-title">劇情回顧</div>
      <button class="panel-close-btn" style="margin:0" onclick="closeLogPanel()">✕</button>
    </div>
    <div id="log-list">${html}</div>`;
  // 捲到底部
  setTimeout(() => {
    const list = document.getElementById("log-list");
    if (list) list.scrollTop = list.scrollHeight;
  }, 50);
}

function addToLog(entry) {
  logHistory.push(entry);
  if (logHistory.length > 200) logHistory.shift();
}

// ════════════════════════════════════════════════════
// TOOLBAR BUTTONS
// ════════════════════════════════════════════════════
function initToolbar() {
  document.getElementById("btn-log").addEventListener("click", () => {
    if (document.getElementById("log-panel").style.display !== "none") closeLogPanel();
    else { closeSavePanel(); openLogPanel(); }
  });
  document.getElementById("btn-save").addEventListener("click", () => {
    if (state.phase !== "game") { showToast("請先開始遊戲"); return; }
    if (document.getElementById("save-panel").style.display !== "none") closeSavePanel();
    else { closeLogPanel(); openSavePanel(); }
  });
  document.getElementById("btn-music").addEventListener("click", toggleMusic);
}

// ════════════════════════════════════════════════════
// TYPEWRITER
// ════════════════════════════════════════════════════
let twTimer = null, twIndex = 0, twText = "", twDone = false, twCallback = null;
function twStart(text, speed, onDone) {
  clearInterval(twTimer);
  twText = text; twIndex = 0; twDone = false; twCallback = onDone;
  if (!text) { twDone = true; onDone?.(); return; }
  twTimer = setInterval(() => {
    twIndex++;
    renderTypewriter();
    if (twIndex >= twText.length) { clearInterval(twTimer); twDone = true; onDone?.(); renderTypewriter(); }
  }, speed || 38);
}
function twSkip() {
  clearInterval(twTimer); twIndex = twText.length; twDone = true; twCallback?.(); renderTypewriter();
}

// ════════════════════════════════════════════════════
// PARTICLES
// ════════════════════════════════════════════════════
function renderParticles(show) {
  const layer = document.getElementById("particles-layer");
  layer.innerHTML = "";
  if (!show) return;
  for (let i = 0; i < 20; i++) {
    const d = document.createElement("div");
    d.className = "particle";
    const big = i % 4 === 0;
    d.style.cssText = `width:${big?2:1}px;height:${big?2:1}px;background:${i%5===0?"rgba(180,160,100,0.35)":"rgba(140,160,200,0.2)"};left:${(i*19+7)%100}%;top:${(i*31+13)%100}%;animation:pfloat${i%3} ${10+(i%6)*2}s ease-in-out infinite;animation-delay:${(i*0.6)%7}s;`;
    layer.appendChild(d);
  }
}

// ════════════════════════════════════════════════════
// BACKGROUND
// ════════════════════════════════════════════════════
let currentBg = null;
function updateBg(bgKey) {
  if (bgKey === currentBg) return;
  currentBg = bgKey;
  const bg = BG_STYLES[bgKey] || BG_STYLES.night_fog;
  document.getElementById("game-window").style.backgroundImage = `url("${bg.image}")`;
  document.getElementById("bg-overlay").style.background = bg.overlay;
  renderParticles(bg.particles);
  playMusicForScene(bgKey);
}

// ════════════════════════════════════════════════════
// NAVIGATE
// ════════════════════════════════════════════════════
function goTo(newId) {
  const content = document.getElementById("content");
  content.style.opacity = "0";
  setTimeout(() => {
    state.nodeId = newId;
    state.lineIndex = 0;
    // 確保目標節點的章節已載入，再渲染
    ensureChapterLoaded(newId, () => {
      content.style.opacity = "1";
      renderGame();
    });
  }, 300);
}

// ════════════════════════════════════════════════════
// RESOLVE TEXT
// ════════════════════════════════════════════════════
function resolveText(text) {
  return (text || "")
    .replace(/\{name\}/g, state.playerName || "你")
    .replace(/他\/她/g, state.playerGender === "female" ? "她" : "他")
    .replace(/他的/g, state.playerGender === "female" ? "她的" : "他的");
}

// ════════════════════════════════════════════════════
// RENDER TYPEWRITER
// ════════════════════════════════════════════════════
function renderTypewriter() {
  const node = STORY[state.nodeId];
  if (!node || node.type) return;
  const textEl = document.getElementById("dialogue-text");
  const cursorEl = document.getElementById("cursor-blink");
  const continueEl = document.getElementById("continue-indicator");
  const subtextEl = document.getElementById("subtext");
  const lines = node.lines || [];
  const isLast = state.lineIndex >= lines.length - 1;
  if (textEl) {
    textEl.textContent = twText.slice(0, twIndex);
    if (cursorEl) cursorEl.style.display = twDone ? "none" : "inline";
  }
  if (continueEl) {
    continueEl.style.display = twDone ? "block" : "none";
    continueEl.style.color = isLast ? "rgba(210,185,120,0.7)" : "rgba(150,145,135,0.5)";
    continueEl.textContent = isLast ? "繼續 ▶" : "▶";
  }
  if (subtextEl) {
    subtextEl.style.display = (twDone && node.subtext && state.lineIndex === lines.length-1) ? "block" : "none";
  }
}

// ════════════════════════════════════════════════════
// RENDER GAME
// ════════════════════════════════════════════════════
function renderGame() {
  if (state.phase === "title") { renderTitle(); return; }
  const node = STORY[state.nodeId];
  if (!node) return;
  updateBg(node.bg || "night_fog");
  if (node.type === "chapter_title") { renderChapterTitle(node); updateSprite(null); return; }
  if (node.type === "chapter_end")   { renderChapterEnd(node);   updateSprite(null); return; }
  if (node.type === "save_prompt")   { renderSavePrompt(node);   updateSprite(null); return; }

  const content = document.getElementById("content");
  content.innerHTML = `
    <div id="scene-label">
      <div id="scene-name">${node.scene || ""}</div>
      <div id="chapter-name">${node.chapter || ""}</div>
    </div>
    <div id="spacer"></div>
    <div id="bottom-ui"></div>
  `;
  const bottomUI = document.getElementById("bottom-ui");
  if (node.type === "input_name")   { updateSprite(null); renderNameInput(node, bottomUI); return; }
  if (node.type === "input_gender") { updateSprite(null); renderGenderSelect(node, bottomUI); return; }
  if (node.type === "choice")       { updateSprite(null); renderChoiceBox(node, bottomUI); return; }
  renderDialogue(node, bottomUI);
}

// ════════════════════════════════════════════════════
// TITLE
// ════════════════════════════════════════════════════
function renderTitle() {
  updateBg("night_fog");
  playMusicForScene("__title__");
  const content = document.getElementById("content");
  content.innerHTML = `
    <div id="title-screen">
      <div id="title-label">A Text Adventure</div>
      <h1 id="title-main">〔　　〕</h1>
      <div id="title-divider"></div>
      <p id="title-tagline">沒有人記得他的名字。沒有人記得她的臉。<br />但有些事燃燒過。就算燒完了，灰還在。</p>
      <div id="title-buttons">
        <button id="start-btn">開始遊戲</button>
        <button id="load-btn">讀取存檔</button>
      </div>
      <div id="title-chapter-label">第零章 · 第一章</div>
    </div>
  `;
  setTimeout(() => { const ts = document.getElementById("title-screen"); if (ts) ts.style.opacity = "1"; }, 200);
  document.getElementById("start-btn").addEventListener("click", () => {
    state = { phase:"game", nodeId:"ch0_open", lineIndex:0, playerName:"", playerGender:"male", affinity:0, visitedNodes:[], musicMuted:state.musicMuted };
    logHistory.length = 0;
    renderGame();
  });
  document.getElementById("load-btn").addEventListener("click", () => { openSavePanel(); });
}

// ════════════════════════════════════════════════════
// CHAPTER TITLE / END
// ════════════════════════════════════════════════════
function renderChapterTitle(node) {
  playMusicForScene("__chapter__");
  const content = document.getElementById("content");
  content.innerHTML = `
    <div id="chapter-title-screen">
      <div id="chapter-label">${node.chapter}</div>
      <div class="chapter-divider"></div>
      <h2 id="chapter-title-text">${node.title}</h2>
      <div class="chapter-divider" style="margin-top:20px;margin-bottom:0"></div>
      <div id="chapter-continue">CLICK TO CONTINUE</div>
    </div>
  `;
  setTimeout(() => { const ct = document.getElementById("chapter-title-screen"); if (ct) ct.style.opacity = "1"; }, 100);
  document.getElementById("chapter-title-screen").addEventListener("click", () => goTo(node.next));
}

function renderChapterEnd(node) {
  playMusicForScene("__end__");
  const content = document.getElementById("content");
  // 判斷是否有下一章
  const hasNext = !!node.next;
  const comingText = hasNext ? "點擊任意處繼續。" : "下一章即將推出，敬請期待。";
  content.innerHTML = `
    <div id="chapter-end-screen" ${hasNext ? 'style="cursor:pointer"' : ''}>
      <div id="end-label">END OF</div>
      <div id="end-chapter-title">${node.chapter}　${node.title}</div>
      <div id="end-divider"></div>
      <p id="end-coming">${comingText}</p>
      <p id="end-fin">——完——</p>
    </div>
  `;
  setTimeout(() => { const ce = document.getElementById("chapter-end-screen"); if (ce) ce.style.opacity = "1"; }, 100);
  if (hasNext) {
    document.getElementById("chapter-end-screen").addEventListener("click", () => goTo(node.next));
  }
}

// ════════════════════════════════════════════════════
// SAVE PROMPT（黑屏詢問存檔）
// ════════════════════════════════════════════════════
function renderSavePrompt(node) {
  playMusicForScene("__end__");
  // 黑屏
  const gw = document.getElementById("game-window");
  gw.style.backgroundImage = "none";
  document.getElementById("bg-overlay").style.background = "#000";
  document.getElementById("vignette").style.opacity = "0";
  document.getElementById("particles-layer").innerHTML = "";

  const content = document.getElementById("content");
  const lines = (node.prompt || "").split("\\n");
  const promptHtml = lines.map(l => `<div>${l}</div>`).join("");

  content.innerHTML = `
    <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;animation:fadeIn 1.2s ease;">
      <div style="text-align:center;font-family:'Noto Serif TC',serif;font-size:13px;letter-spacing:3px;color:rgba(180,155,90,0.75);line-height:2.2;">
        ${promptHtml}
      </div>
      <div style="width:80px;height:1px;background:linear-gradient(90deg,transparent,rgba(180,155,90,0.3),transparent);"></div>
      <div style="display:flex;gap:16px;">
        <button class="choice-btn" id="save-prompt-yes" style="padding:14px 28px;justify-content:center;">
          <span class="choice-text">儲存進度</span>
        </button>
        <button class="choice-btn" id="save-prompt-skip" style="padding:14px 28px;justify-content:center;border-color:rgba(100,100,120,0.2);">
          <span class="choice-text" style="color:rgba(150,145,135,0.6);">繼續</span>
        </button>
      </div>
    </div>
  `;

  document.getElementById("save-prompt-yes").addEventListener("click", () => {
    // 打開存檔面板；關閉後前進下一節點
    openSavePanel();
    // 在存檔面板的關閉按鈕上掛一次性攔截
    const origClose = closeSavePanel;
    window._savePanelOnClose = () => {
      window._savePanelOnClose = null;
      goTo(node.next);
    };
  });

  document.getElementById("save-prompt-skip").addEventListener("click", () => {
    goTo(node.next);
  });

  // 恢復 vignette
  document.getElementById("vignette").style.opacity = "1";
}

// ════════════════════════════════════════════════════
// DIALOGUE
// ════════════════════════════════════════════════════
// ── 主角頭像 SVG（根據性別切換）────────────────────────

  const goldAccent  = "rgba(180,155,90,0.7)";

  if (isFemale) {
    // 女性頭像：較圓的臉型、長髮、細眉
    return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <!-- 長髮（後層） -->
      <ellipse cx="20" cy="30" rx="12" ry="9" fill="${hairColor}" opacity="0.9"/>
      <!-- 臉 -->
      <ellipse cx="20" cy="19" rx="9" ry="10" fill="${skinColor}"/>
      <!-- 頭髮（前層） -->
      <ellipse cx="20" cy="11" rx="9.5" ry="7" fill="${hairColor}"/>
      <!-- 瀏海 -->
      <path d="M11.5 13 Q14 8 20 9 Q26 8 28.5 13" fill="${hairColor}"/>
      <!-- 耳朵 -->
      <ellipse cx="11" cy="20" rx="1.8" ry="2.2" fill="${skinColor}"/>
      <ellipse cx="29" cy="20" rx="1.8" ry="2.2" fill="${skinColor}"/>
      <!-- 眼睛 -->
      <ellipse cx="16.5" cy="19" rx="2" ry="1.5" fill="${eyeColor}"/>
      <ellipse cx="23.5" cy="19" rx="2" ry="1.5" fill="${eyeColor}"/>
      <!-- 眼神高光 -->
      <circle cx="17.3" cy="18.3" r="0.5" fill="rgba(255,255,255,0.7)"/>
      <circle cx="24.3" cy="18.3" r="0.5" fill="rgba(255,255,255,0.7)"/>
      <!-- 細眉 -->
      <path d="M14.5 16.5 Q16.5 15.5 18.5 16.2" stroke="${hairColor}" stroke-width="0.7" fill="none" stroke-linecap="round"/>
      <path d="M21.5 16.2 Q23.5 15.5 25.5 16.5" stroke="${hairColor}" stroke-width="0.7" fill="none" stroke-linecap="round"/>
      <!-- 嘴 -->
      <path d="M17.5 24 Q20 25.5 22.5 24" stroke="rgba(180,100,90,0.7)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
      <!-- 金色裝飾（髮飾） -->

    // 男性頭像：較方的臉型、短髮、粗眉
    return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <!-- 臉 -->
      <rect x="11" y="12" width="18" height="20" rx="5" ry="6" fill="${skinColor}"/>
      <!-- 頭髮 -->
      <ellipse cx="20" cy="13" rx="9" ry="5.5" fill="${hairColor}"/>
      <rect x="11" y="11" width="18" height="5" rx="3" fill="${hairColor}"/>
      <!-- 耳朵 -->
      <ellipse cx="11" cy="21" rx="1.8" ry="2.2" fill="${skinColor}"/>
      <ellipse cx="29" cy="21" rx="1.8" ry="2.2" fill="${skinColor}"/>
      <!-- 眼睛 -->
      <ellipse cx="16.5" cy="20" rx="2.2" ry="1.6" fill="${eyeColor}"/>
      <ellipse cx="23.5" cy="20" rx="2.2" ry="1.6" fill="${eyeColor}"/>
      <!-- 眼神高光 -->
      <circle cx="17.4" cy="19.2" r="0.55" fill="rgba(255,255,255,0.7)"/>
      <circle cx="24.4" cy="19.2" r="0.55" fill="rgba(255,255,255,0.7)"/>
      <!-- 粗眉 -->
      <path d="M14 17.2 Q16.5 16 19 17" stroke="${hairColor}" stroke-width="1.1" fill="none" stroke-linecap="round"/>
      <path d="M21 17 Q23.5 16 26 17.2" stroke="${hairColor}" stroke-width="1.1" fill="none" stroke-linecap="round"/>
      <!-- 嘴 -->
      <path d="M17 25.5 Q20 26.8 23 25.5" stroke="rgba(160,90,80,0.6)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
      <!-- 金色衣領裝飾 -->
      <path d="M15 32 Q20 34 25 32" stroke="${goldAccent}" stroke-width="1.2" fill="none" stroke-linecap="round"/>

}

function renderDialogue(node, container) {
  const lines = node.lines || [];
  const isNarration = node.isNarration;
  const speaker = node.speaker;
  const resolvedLine = resolveText(lines[state.lineIndex] || "");

  // 判斷是否為主角說話（speaker 為玩家名字，或節點標記 isPlayer）
  const isPlayerSpeaking = !isNarration && speaker && (
    speaker === state.playerName ||
    node.isPlayer === true
  );

  const boxBg     = isNarration ? "rgba(5,5,10,0.55)"    : "rgba(8,6,14,0.82)";
  const boxBorder = isNarration
    ? "rgba(140,150,180,0.12)"
    : isPlayerSpeaking
      ? "rgba(180,155,90,0.35)"
      : "rgba(180,155,90,0.2)";
  const textColor = isNarration ? "rgba(190,185,175,0.85)": "rgba(230,220,200,0.95)";

  // 頭像 HTML
  const avatarHTML = isPlayerSpeaking ? `
    <div id="player-avatar-wrap">
      <div id="player-avatar-frame">
        ${getPlayerAvatarSVG(state.playerGender)}
      </div>
      <span id="player-avatar-name">${state.playerName || "你"}</span>
    </div>` : "";

  container.innerHTML = `
    <div id="dialogue-wrap">
      ${speaker && !isNarration && !isPlayerSpeaking ? `<div id="speaker-plate"><span id="speaker-name">${speaker}</span></div>` : ""}
      <div id="text-box" style="background:${boxBg};border:1px solid ${boxBorder};position:relative;">
        ${avatarHTML}
        <p id="dialogue-text" style="color:${textColor};${isPlayerSpeaking ? "padding-left:0;" : ""}"></p>
        <span id="cursor-blink">▌</span>
        <p id="subtext" style="display:none">${node.subtext || ""}</p>
        <div id="continue-indicator" style="display:none"></div>
      </div>
      ${lines.length > 1 ? `<div id="line-dots">${lines.map((_,i) => `
        <div class="dot" style="width:${i===state.lineIndex?16:4}px;background:${i===state.lineIndex?"rgba(210,185,120,0.7)":i<state.lineIndex?"rgba(180,155,90,0.4)":"rgba(100,100,120,0.3)"}"></div>
      `).join("")}</div>` : ""}
    </div>
  `;

  twStart(resolvedLine, 38, () => { renderTypewriter(); });

  // 更新角色立繪
  updateSprite(isNarration ? null : speaker);

  document.getElementById("dialogue-wrap").addEventListener("click", () => {
    if (!twDone) { twSkip(); return; }
    // 記錄已讀文字
    addToLog({ speaker: isNarration ? null : speaker, text: resolvedLine, scene: node.scene || node.chapter || "" });
    const isLast = state.lineIndex >= lines.length - 1;
    if (!isLast) {
      state.lineIndex++;
      renderDialogue(node, container);
    } else if (node.next) {
      goTo(node.next);
    }
  });
}

// ════════════════════════════════════════════════════
// CHOICE BOX
// ════════════════════════════════════════════════════
function renderChoiceBox(node, container) {
  const prompt = resolveText(node.prompt);
  container.innerHTML = `
    <div id="choice-wrap">
      <div id="choice-prompt-box"><p id="choice-prompt-text">${prompt}</p></div>
      <div id="choices-list">
        ${node.choices.map((c,i) => `
          <button class="choice-btn" data-idx="${i}">
            <span class="choice-letter">${String.fromCharCode(65+i)}</span>
            <span class="choice-text">${c.text}</span>
            ${c.tag ? `<span class="choice-tag">${c.tag}</span>` : ""}
          </button>
        `).join("")}
      </div>
    </div>
  `;
  document.querySelectorAll(".choice-btn").forEach((btn, i) => {
    btn.addEventListener("click", () => {
      btn.classList.add("selected");
      const choice = node.choices[i];
      // 好感度計算
      if (typeof choice.affinity === "number") {
        state.affinity += choice.affinity;
      }
      // 記錄選擇到回顧
      addToLog({ speaker: "【你的選擇】", text: choice.text, scene: node.scene || node.chapter || "" });
      setTimeout(() => goTo(choice.next), 400);
    });
  });
}

// ════════════════════════════════════════════════════
// NAME INPUT
// ════════════════════════════════════════════════════
function renderNameInput(node, container) {
  container.innerHTML = `
    <div id="name-wrap">
      <div id="name-prompt-box"><p id="name-prompt-text">${node.prompt}</p></div>
      <div id="name-input-row">
        <input id="name-input" placeholder="輸入你的名字…" maxlength="12" autocomplete="off" />
        <button id="name-submit">確認</button>
      </div>
    </div>
  `;
  const input = document.getElementById("name-input");
  const submit = document.getElementById("name-submit");
  const doSubmit = () => {
    const v = input.value.trim();
    if (!v) return;
    state.playerName = v;
    goTo(node.next);
  };
  input.addEventListener("input", () => { submit.classList.toggle("active", !!input.value.trim()); });
  input.addEventListener("keydown", e => { if (e.key === "Enter") doSubmit(); });
  submit.addEventListener("click", doSubmit);
  input.focus();
}

// ════════════════════════════════════════════════════
// GENDER SELECT
// ════════════════════════════════════════════════════
function renderGenderSelect(node, container) {
  container.innerHTML = `
    <div id="gender-wrap">
      <div id="gender-prompt-box"><p id="gender-prompt-text">${node.prompt}</p></div>
      <div id="gender-buttons">
        <button class="gender-btn" data-value="male">男</button>
        <button class="gender-btn" data-value="female">女</button>
      </div>
    </div>
  `;
  document.querySelectorAll(".gender-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.playerGender = btn.dataset.value;
      goTo(node.next);
    });
  });
}

// ════════════════════════════════════════════════════
// 頁面可見性：離開/鎖屏暫停音樂，回來後自動恢復
// ════════════════════════════════════════════════════
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    // 頁面隱藏（切分頁、鎖屏）→ 暫停所有軌道
    Object.values(audioPlayers).forEach(a => a.pause());
  } else {
    // 回到頁面 → 若未手動靜音則恢復播放
    if (!state.musicMuted && activeTrack) {
      audioPlayers[activeTrack].play().catch(() => {});
    }
  }
});

  </div>`;

// 啟動時只載入第一章（序章+第一章），其他章節在切換時自動載入
fetch("story_ch1.json")
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(data => {
    Object.assign(STORY, data);

        <div style="font-family:'Noto Serif TC',serif;font-size:12px;color:rgba(160,155,145,0.6);line-height:2;">
          找不到 story_ch1.json<br/>請確認檔案和 index.html 放在同一個資料夾
        </div>
      </div>`;
  });
</script>
